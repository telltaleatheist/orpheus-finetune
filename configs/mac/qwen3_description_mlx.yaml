# MLX QLoRA config — the DESCRIPTION adapter of the Headline model line.
# Run with:
#
#   mlx_lm.lora -c configs/mac/qwen3_description_mlx.yaml
#
# CLI flags override anything set here, so this is a starting point you can poke
# at (`-c ... --iters 5 --val-batches 2` for a smoke run).
#
# NOT a 1:1 port of the rig recipe. MLX is a different trainer: different
# optimizer implementation, different RNG, different LoRA math (it takes a
# `scale` where peft takes `alpha`). Numbers will not match the rig's run for the
# same seed. Treat this as "the same intent", never "the same run".
# See docs/MAC_TRAINING.md.
#
# ARCHITECTURE: one base, one adapter per task. This trains only the
# `task: description` slice of the corpus; `task: title` (the existing DPO
# adapter), `task: tags` and `task: chapter` are separate adapters over the same
# base. Nothing here touches the titles adapter.

# 4-bit QLoRA on 32B. Owen's call, 2026-08-04: this run is a TEST of what the
# Mac can actually do — the production path stays 14B on the CUDA rig. 32B at
# 4-bit is ~18.5 GB of weights and peaks in the high twenties to mid thirties of
# GB, against a ~48 GB wired ceiling on this 64 GB machine.
#
# THE MACHINE MUST BE OTHERWISE IDLE FOR THIS. Close BookForge, Chrome, and any
# TTS render before launching. macOS does not OOM cleanly — it compresses, then
# swaps, then the training loop runs 10x slower and looks like a hardware
# problem. See the "what actually fits in 64 GB" table in docs/MAC_TRAINING.md.
#
# This is the mlx-community conversion of Qwen/Qwen3-32B; mlx-lm loads it
# directly, no local `mlx_lm.convert` step needed.
model: "mlx-community/Qwen3-32B-4bit"
train: true

# Directory holding train.jsonl / valid.jsonl (test.jsonl optional).
# mlx-lm reads the same {"messages": [...]} chat rows the rig harness uses, so a
# dataset built by build_titles_dataset.py works unchanged — it just has to be
# split into files named train/valid rather than passed as two --*-data flags.
# 3,971 train rows / 95 valid rows, filtered to the `task: description` prefix.
data: "/Volumes/Callisto/training/titles/mlx-description"

fine_tune_type: lora
optimizer: adamw
seed: 3407

# -1 = adapt every layer. The rig recipe is full-depth LoRA; MLX defaults to the
# top 16 layers only, which is a quietly different experiment.
num_layers: -1

# Effective batch is 16, the rig's, as 2x8. batch_size 2 is MEASURED against 32B
# on the Mac Studio (2026-08-04): batch 1 = 10.5 s/row / 22.4 GB peak, batch 2 =
# 7.6 s/row / 25.4 GB peak, batch 4 = thrashed (page-faulting at 1.6% CPU with
# ~4 GB unused). Do not raise it without re-probing.
batch_size: 2
grad_accumulation_steps: 8

# READ THIS BEFORE CHANGING iters.
#
# One MLX iteration consumes `batch_size` rows — NOT batch_size x
# grad_accumulation_steps. Grad accumulation only decides how often the optimizer
# applies the accumulated gradient. Verified in mlx-lm 0.31.3 trainer.py, where
# the loop zips range(1, iters+1) against iterate_batches(batch_size=batch_size),
# and confirmed by a smoke run's token counts. docs/MAC_TRAINING.md carried the
# wrong formula until 2026-08-04; dividing by the effective batch trains a
# SIXTEENTH of what the config claims.
#
# So: iters = epochs x rows / batch_size. 3,971 / 2 = 1986 iters per epoch.
#
# ONE epoch. The rig's text models peaked at epoch 1, and at 32B an epoch here is
# most of a day — see the title config for measured timings. Eight checkpoints
# spread across one epoch bracket the expected peak; a second epoch is
# --resume-adapter-file <adapter_path>/adapters.safetensors --iters 1986
# if the val curve is still falling. Each checkpoint is ~1.07 GB.
#
# save_every is an eighth of an epoch and steps_per_eval matches it, so every
# checkpoint has a val loss attached. There is no early stopping in MLX; the
# winner is picked by hand from the NNNNNNN_adapters.safetensors files.
iters: 1986
save_every: 248
steps_per_eval: 248
steps_per_report: 10

# -1 = score the entire validation set. 95 rows is cheap to evaluate in full, and
# a full pass makes the checkpoint-to-checkpoint deltas mean something — with a
# sampled 25 batches the noise is the same size as the signal we are choosing on.
val_batches: -1

learning_rate: 1.0e-4
lr_schedule:
  name: cosine_decay
  warmup: 50
  arguments: [1.0e-4, 1986, 1.0e-6]   # [init lr, decay steps, end lr]

max_seq_length: 2048
grad_checkpoint: true

# Assistant-only loss. The rig profile expresses this as
# dataset.assistant_only_loss; MLX spells it --mask-prompt.
mask_prompt: true

adapter_path: "/Volumes/Callisto/training/titles/mlx-adapters/description-v2"

lora_parameters:
  # scale = alpha / rank in peft terms. The rig uses r=32, alpha=32 -> scale 1.0.
  keys:
    - "self_attn.q_proj"
    - "self_attn.k_proj"
    - "self_attn.v_proj"
    - "self_attn.o_proj"
    - "mlp.gate_proj"
    - "mlp.up_proj"
    - "mlp.down_proj"
  rank: 32
  scale: 1.0
  dropout: 0.0
